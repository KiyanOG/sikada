<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title class=   "white-text">Dashboard Admin SIKADA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 sidebar">
            
            <h3 class="mt-4 text-center white-text">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard"
               class="menu-link white-text">
                Dashboard
            </a>

            <a href="/admin/komoditas"
               class="menu-link white-text">
                Komoditas
            </a>

            <a href="/admin/pasar"
               class="menu-link white-text">
                Pasar
            </a>

            <a href="/admin/harga"
               class="menu-link white-text">
                Harga
            </a>

            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link white-text text-danger">
                Logout
            </a>

        </div>

        <!-- Content -->

        <div class="col-md-10 p-4">

            <h2 class="white-text">
                Dashboard
            </h2>

            <div class="row mt-4">

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Total Komoditas</h5>

                            <h2 th:text="${totalKomoditas}">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Total Pasar</h5>

                            <h2 th:text="${totalPasar}">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h5>Total Harga</h5>

                            <h2 th:text="${totalHarga}">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
