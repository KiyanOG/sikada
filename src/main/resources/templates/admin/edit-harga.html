<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Harga</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            
            <h3 class="mt-4 text-center">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard" class="menu-link">Dashboard</a>
            <a href="/admin/komoditas" class="menu-link">Komoditas</a>
            <a href="/admin/pasar" class="menu-link">Pasar</a>
            <a href="/admin/harga" class="menu-link">Harga</a>
            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link text-danger">
                Logout
            </a>

        </div>

        <!-- Content -->
        <div class="col-md-10 content">

            <div class="container mt-4">

                <div class="card shadow">

                    <div class="card-header bg-warning text-dark">

                        <h4>Edit Harga</h4>

                    </div>

                    <div class="card-body">

                        <form th:action="@{/admin/harga/update}"
                              th:object="${harga}"
                              method="post">

                            <!-- Hidden ID -->
                            <input type="hidden"
                                   name="id"
                                   th:value="${harga.id}">

                            <!-- Komoditas -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Komoditas
                                </label>

                                <select name="komoditasId"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        -- Pilih Komoditas --
                                    </option>

                                    <option th:each="k : ${komoditasList}"
                                            th:value="${k.id}"
                                            th:text="${k.namaKomoditas}"
                                            th:selected="${harga.komoditas.id == k.id}">
                                            </option>

                                </select>

                            </div>

                            <!-- Pasar -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Pasar
                                </label>

                                <select name="pasarId"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        -- Pilih Pasar --
                                    </option>

                                    <option th:each="p : ${pasarList}"
                                            th:value="${p.id}"
                                            th:text="${p.namaPasar}"
                                            th:selected="${harga.pasar.id == p.id}">
                                    </option>

                                </select>

                            </div>

                            <!-- Harga -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Harga
                                </label>

                                <input type="number"
                                       name="harga"
                                        th:value="${harga.harga}"
                                        class="form-control"
                                        required>

                            </div>

                            <button type="submit"
                                    class="btn btn-primary">

                                Update

                            </button>

                            <a href="/admin/harga"
                               class="btn btn-secondary">

                                Kembali

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
