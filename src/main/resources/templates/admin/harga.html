<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Data Harga</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar">

            <h3 class="mt-4 text-center">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard" class="menu-link">Dashboard</a>
            <a href="/admin/komoditas" class="menu-link">Komoditas</a>
            <a href="/admin/pasar" class="menu-link">Pasar</a>
            <a href="/admin/harga" class="menu-link">Harga</a>
            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link text-danger">
                Logout
            </a>

        </div>

        <div class="col-md-10 content">

            <div class="card shadow mt-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between mb-3">

                        <h4 class="mb-0">
                            Data Harga
                        </h4>

                        <a href="/admin/harga/tambah"
                           class="btn btn-success">

                            + Tambah Harga

                        </a>

                    </div>

                    <div class="card mb-3 p-3">

    <form method="get"
          action="/admin/harga">

        <div class="row">

            <div class="col-md-5">

                <select name="pasarId"
                        class="form-select">

                    <option value="">
                        Semua Pasar
                    </option>

                    <option
                            th:each="p : ${pasarList}"
                            th:value="${p.id}"
                            th:text="${p.namaPasar}"
                            th:selected="${selectedPasarId != null and selectedPasarId == p.id}">
                    </option>

                </select>

            </div>

            <div class="col-md-5">

                <select name="komoditasId"
                        class="form-select">

                    <option value="">
                        Semua Komoditas
                    </option>

                    <option
                            th:each="k : ${komoditasList}"
                            th:value="${k.id}"
                            th:text="${k.namaKomoditas}"
                            th:selected="${selectedKomoditasId != null and selectedKomoditasId == k.id}">
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <button type="submit"
                        class="btn btn-primary w-100">

                    Filter

                </button>

            </div>

        </div>

    </form>

</div>
        <div class="table-responsive">

            <table class="table table-hover mb-0"
                   id="hargaTable">

                <thead>

                <tr>

                    <th>Komoditas</th>

                    <th>Harga</th>

                    <th>Pasar</th>

                    <th>Tanggal</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="harga : ${hargaList}">

                    <td th:text="${harga.komoditas.namaKomoditas}">
                    </td>

                    <td>

                        Rp
                        <span th:text="${#numbers.formatDecimal(harga.harga,0,'POINT',0,'COMMA')}">
                        </span>

                    </td>

                    <td th:text="${harga.pasar.namaPasar}">
                    </td>

                    <td th:text="${harga.tanggal}">
                    </td>

                    <td>

                                <a th:href="@{/admin/harga/edit/{id}(id=${harga.id})}"
                                   class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a th:href="@{/admin/harga/hapus/{id}(id=${harga.id})}"
                                   class="btn btn-danger btn-sm">

                                    Hapus

                                </a>

                            </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
