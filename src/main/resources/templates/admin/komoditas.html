<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Data Komoditas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h3 class="mt-4 text-center white-text">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard" class="menu-link white-text">
                Dashboard
            </a>

            <a href="/admin/komoditas" class="menu-link white-text">
                Komoditas
            </a>

            <a href="/admin/pasar" class="menu-link white-text">
                Pasar
            </a>

            <a href="/admin/harga" class="menu-link white-text">
                Harga
            </a>

            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link text-danger">
                Logout
            </a>

        </div>

        <!-- Content -->
        <div class="col-md-10 content">

            <div class="container mt-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between mb-3">

                        <h2 class="white-text">Data Komoditas</h2>

                        <a href="/admin/komoditas/tambah"
                            class="btn btn-success">

                            + Tambah Komoditas

                        </a>

                    </div>

                        <table class="table table-bordered table-striped">

                        <thead class="table-dark">

                            <tr>
                            <th>ID</th>
                            <th>Nama Komoditas</th>
                            <th>Satuan</th>
                            <th width="200">Aksi</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="k : ${komoditasList}">

                            <td th:text="${k.id}"></td>

                            <td th:text="${k.namaKomoditas}"></td>

                            <td th:text="${k.satuan}"></td>

                            <td>

                                <a th:href="@{/admin/komoditas/edit/{id}(id=${k.id})}"
                                 class="btn btn-warning btn-sm">

                                 Edit

                                </a>

                                <a th:href="@{/admin/komoditas/hapus/{id}(id=${k.id})}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Yakin hapus data?')">

                                Hapus

                                </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>
                
                </div>
            
            </div>
        
        </div> 

    </div>

</div>

</body>
