<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Data Pasar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar">

            <h3 class="mt-4 text-center">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard" class="menu-link">Dashboard</a>
            <a href="/admin/komoditas" class="menu-link">Komoditas</a>
            <a href="/admin/pasar" class="menu-link">Pasar</a>
            <a href="/admin/harga" class="menu-link">Harga</a>
            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link text-danger">
                Logout
            </a>

        </div>

        <div class="col-md-10 content">

            <div class="card shadow mt-4">

                <div class="card-body">

                    <div class="d-flex justify-content-between mb-3">

                        <h3>Data Pasar</h3>

                        <a href="/admin/pasar/tambah"
                           class="btn btn-success">

                            + Tambah Pasar

                        </a>

                    </div>

                    <table class="table table-bordered">

                        <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Nama Pasar</th>
                            <th>Alamat</th>
                            <th>Aksi</th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="p : ${pasarList}">

                            <td th:text="${p.id}"></td>

                            <td th:text="${p.namaPasar}"></td>

                            <td th:text="${p.alamat}"></td>

                            <td>

                                <a th:href="@{/admin/pasar/edit/{id}(id=${p.id})}"
                                   class="btn btn-warning btn-sm">

                                    Edit

                                </a>

                                <a th:href="@{/admin/pasar/hapus/{id}(id=${p.id})}"
                                   class="btn btn-danger btn-sm">

                                    Hapus

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
