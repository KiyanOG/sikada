<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Tambah Komoditas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h3 class="mt-4 text-center">
                <img src="/img/logo.png" alt="Logo" class="logo">
                SIKADA
            </h3>

            <hr>

            <a href="/admin/dashboard" class="menu-link">
                Dashboard
            </a>

            <a href="/admin/komoditas" class="menu-link">
                Komoditas
            </a>

            <a href="/admin/pasar" class="menu-link">
                Pasar
            </a>

            <a href="/admin/harga" class="menu-link">
                Harga
            </a>

            <a href="/admin/logout"
                onclick="return confirm('Apakah Anda yakin ingin logout?')"
               class="menu-link text-danger">
                Logout
            </a>

        </div>

        <!-- Content -->
        <div class="col-md-10 content">

            <div class="card shadow mt-4">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        Tambah Komoditas
                    </h4>

                </div>

                <div class="card-body">

                    <form action="/admin/komoditas/simpan"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Nama Komoditas
                            </label>

                            <input type="text"
                                   name="namaKomoditas"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Satuan
                            </label>

                            <select name="satuan"
                                    class="form-select"
                                    required>

                                <option value="">
                                    -- Pilih Satuan --
                                </option>

                                <option value="Kg">
                                    Kg
                                </option>

                                <option value="Liter">
                                    Liter
                                </option>

                                <option value="Ekor">
                                    Ekor
                                </option>

                                <option value="Butir">
                                    Butir
                                </option>

                                <option value="Ikat">
                                    Ikat
                                </option>

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-success">

                            Simpan

                        </button>

                        <a href="/admin/komoditas"
                           class="btn btn-secondary">

                            Kembali

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
