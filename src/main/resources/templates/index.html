<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SIKADA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           href="#">

            <img th:src="@{/img/logo.png}"
                 class="logo">

            <div class="brand-text">

                <h5>SIKADA</h5>

                <p>
                    Sistem Informasi Komoditas Daerah
                </p>

            </div>

        </a>

    </div>

</nav>

<!-- HEADER -->

<section class="hero">

    <div class="container">

        <h1>
            Harga Komoditas Bangka Selatan
        </h1>

        <p>
            Pantau harga kebutuhan pokok secara real-time.
        </p>

    </div>

</section>

<!-- SUMMARY -->

<div class="container mt-4">

    <div class="row g-3">

        <div class="col-md-3">

            <div class="summary-card">

                <small>Total Data Harga</small>

                <h3 th:text="${#lists.size(hargaList)}">
                    0
                </h3>

            </div>

        </div>

        <div class="col-md-3">

            <div class="summary-card">

                <small>Total Pasar</small>

                <h3 th:text="${#lists.size(pasarList)}">
                    0
                </h3>

            </div>

        </div>

    </div>

</div>

<!-- FILTER -->

<div class="container mt-4">

    <div class="card p-3">

        <div class="row">

            <div class="col-md-6">

                <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Cari komoditas...">

            </div>

            <div class="col-md-6">

    <select class="form-select"
            onchange="filterPasar(this.value)">

        <option value="">
            Semua Pasar
        </option>

        <option
                th:each="pasar : ${pasarList}"
                th:value="${pasar.id}"
                th:text="${pasar.namaPasar}">
        </option>

    </select>

</div>

<script>
    function filterPasar(pasarId) {

        if (pasarId) {
            window.location.href = "/?pasarId=" + pasarId;
        } else {
            window.location.href = "/";
        }

    }
</script>

        </div>

    </div>

</div>

<!-- TABEL -->

<div class="container mt-4">

    <div class="card">

        <div class="card-header">

            Harga Komoditas

        </div>

        <div class="table-responsive">

            <table class="table table-hover mb-0"
                   id="hargaTable">

                <thead>

                <tr>

                    <th>Komoditas</th>

                    <th>Harga</th>

                    <th>Pasar</th>

                    <th>Tanggal</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="harga : ${hargaList}">

                    <td th:text="${harga.komoditas.namaKomoditas}">
                    </td>

                    <td>

                        Rp
                        <span th:text="${#numbers.formatDecimal(harga.harga,0,'POINT',0,'COMMA')}">
                        </span>

                    </td>

                    <td th:text="${harga.pasar.namaPasar}">
                    </td>

                    <td th:text="${harga.tanggal}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- GRAFIK -->

<div class="container mt-4 mb-5">

    <div class="card">

        <div class="card-header">

            Grafik Harga

        </div>

        <div class="card-body">

            <canvas id="hargaChart">

            </canvas>

        </div>

    </div>

</div>

<footer>

    © 2026 SIKADA

</footer>

<script>

    const searchInput =
        document.getElementById("searchInput");

    searchInput.addEventListener(
        "keyup",
        function () {

            let filter =
                this.value.toLowerCase();

            let rows =
                document.querySelectorAll(
                    "#hargaTable tbody tr"
                );

            rows.forEach(row => {

                let text =
                    row.textContent.toLowerCase();

                row.style.display =
                    text.includes(filter)
                        ? ""
                        : "none";

            });

        });

</script>

<script>

    const ctx =
        document.getElementById('hargaChart');

    new Chart(ctx, {

        type: 'line',

        data: {

            labels: [
                'Sen',
                'Sel',
                'Rab',
                'Kam',
                'Jum'
            ],

            datasets: [{

                label: 'Harga',

                data: [
                    10000,
                    12000,
                    15000,
                    13000,
                    16000
                ]

            }]

        }

    });

</script>

</body>
</html>
